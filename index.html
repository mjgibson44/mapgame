<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MapGame</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="home">
<div class="wrap">
  <header class="home-head">
    <h1>MapGame</h1>
    <p>How well do you know the world's 197 countries?</p>
  </header>

  <nav class="modes" aria-label="Game modes">
    <a class="mode-card" href="alphabet.html">
      <span class="mode-icon" aria-hidden="true">🔤</span>
      <span class="mode-text">
        <b>Alphabet</b>
        <span>Name every country, letter by letter, A to Z.</span>
        <small id="alphabetStat"></small>
      </span>
      <span class="mode-go" aria-hidden="true">›</span>
    </a>
    <a class="mode-card" href="streak.html">
      <span class="mode-icon" aria-hidden="true">⏱</span>
      <span class="mode-text">
        <b>Streak</b>
        <span>Name the country under the pin, against the clock.</span>
        <small id="streakStat"></small>
      </span>
      <span class="mode-go" aria-hidden="true">›</span>
    </a>
  </nav>
</div>

<script src="countries.js?v=3"></script>
<script src="home.js"></script>
</body>
</html>
